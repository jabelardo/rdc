# This is both the Tauri application package and the Cargo workspace root, so
# `crates/*` build, test and lint together with the app. See MIGRATION_PLAN.md
# for the intended layout: the app binary here, per-concern logic in crates/.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
tempfile = "3"

[package]
name = "rdc"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rdc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = "1"

# Workspace crates: the git backend and the credential bridge.
git-ops = { path = "crates/git-ops" }
trampoline = { path = "crates/trampoline" }
# `sync` for the lazy-start mutexes and `process` to ask git its version without going through
# `git-ops` (which would install the trampoline environment and recurse).
tokio = { workspace = true, features = ["sync", "process", "io-util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
