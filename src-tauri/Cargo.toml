# This is both the Tauri application package and the Cargo workspace root, so
# `crates/*` build, test and lint together with the app. See MIGRATION_PLAN.md
# for the intended layout: the app binary here, per-concern logic in crates/.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
thiserror = "2"
tokio = "1"
tempfile = "3"
libc = "0.2"

[package]
name = "rdc"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rdc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Declares the feature used by commands::window::toggle_devtools so clippy's
# check-cfg accepts the conditional. Debug builds compile the inspector call via
# `debug_assertions`; release builds need this flag, matching tauri's own
# `devtools` feature.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = "1"
shlex = { workspace = true }
libc = { workspace = true }
thiserror = { workspace = true }
log = "0.4"

# Workspace crates: the git backend and the credential bridge.
git-ops = { path = "crates/git-ops" }
trampoline = { path = "crates/trampoline" }
# `sync` for the lazy-start mutexes and `process` to ask git its version without going through
# `git-ops` (which would install the trampoline environment and recurse).
tokio = { workspace = true, features = ["sync", "process", "io-util", "fs"] }
# Already in the tree via tauri; taken as a direct dependency for the blob tokens, which want an
# unguessable id rather than a counter — see src/blob_protocol.rs.
uuid = { version = "1", features = ["v4"] }
# The `rdc-blob://` handler builds its own responses.
http = "1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "=2.10.1"
tauri-plugin-log = "2"
trash = "5"
# v3 lets rdc select one persistent store per supported host explicitly:
# Apple Keychain on macOS and Secret Service on Linux. Deliberately omit
# `linux-native` (ephemeral kernel keyring) and Windows until Phase 10.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "sync-secret-service"] }
# Tauri's notification plugin deliberately drops desktop click responses and
# reports every desktop permission as granted. Keep the native handle instead:
# Linux needs its D-Bus response and macOS needs the UNUserNotificationCenter
# preview backend for real permission state and click delivery.
notify-rust = { version = "=4.18.0", features = ["preview-macos-un"] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "=0.3.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = { workspace = true }
