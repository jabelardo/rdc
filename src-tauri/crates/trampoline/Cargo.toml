[package]
name = "trampoline"
version = "0.1.0"
edition = "2021"
description = "Credential/askpass bridge between git and rdc — replaces desktop-plus's vendored desktop-trampoline C binary plus app/src/lib/trampoline/**"

[lib]
name = "trampoline"
path = "src/lib.rs"

# The binary git actually invokes (as GIT_ASKPASS, SSH_ASKPASS or a credential helper).
# Deliberately tiny: it connects, forwards argv/env/stdin, prints the reply.
[[bin]]
name = "rdc-trampoline"
path = "src/bin/rdc-trampoline.rs"

[dependencies]
thiserror = { workspace = true }
# `process` is required by `credential.rs`, which spawns the configured credential helper. It was
# missing here and the crate still built, because `cargo check --workspace` unifies features across
# the graph and the `rdc` crate enables `tokio/process` — so `cargo check -p trampoline` alone was
# broken while every CI gate stayed green. Declare what this crate actually uses.
tokio = { workspace = true, features = [
  "net",
  "io-util",
  "rt",
  "macros",
  "sync",
  "process",
] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
