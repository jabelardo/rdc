[package]
name = "git-ops"
version = "0.1.0"
edition = "2021"
description = "Git operations for rdc — replaces desktop-plus's app/src/lib/git/** (dugite)"

[lib]
name = "git_ops"
path = "src/lib.rs"

[features]
# Exposes real-repository fixtures to workspace dependants' tests without including them in normal
# application builds.
test-support = []

# Run inside the user's login shell to capture the environment that shell builds — see
# src/hooks/shell_env.rs. Replaces desktop-plus's vendored `printenvz` C program.
[[bin]]
name = "rdc-printenvz"
path = "src/bin/rdc-printenvz.rs"

# The binary git runs in place of a hook. Copied under each hook's name into a temporary directory that
# `core.hooksPath` points at — see src/hooks/protocol.rs.
[[bin]]
name = "rdc-hook-proxy"
path = "src/bin/rdc-hook-proxy.rs"

[dependencies]
ignore = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "rt", "macros", "fs", "time", "net", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
